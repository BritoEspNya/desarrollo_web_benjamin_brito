<!DOCTYPE html>
<html>
<head>
    <title>Agregar actividad</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div id="menu" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="index.html">Portada</a>
        <a href="listado-actividades.html">Actividades</a>
        <a href="estadisticas.html">Estadisticas</a>
    </div>
    <span onclick="openNav()">Menu</span>
    <div id="main">
        <div>
            <h1>Agregar actividad</h1>
        </div>
        <form>
            <p>Donde?</p>
            <label>Region</label>
            <select id="regiones-select" onchange="defComunas()" required>
                <option disabled selected value></option>
                <option>I</option>
                <option>II</option>
                <option>III</option>
                <option>IV</option>
                <option>V</option>
                <option>VI</option>
                <option>VII</option>
                <option>VIII</option>
                <option>IX</option>
                <option>X</option>
                <option>XI</option>
                <option>RM</option>
            </select>
            <label>Comuna</label>
            <select id="comunas-select" style="display: none;" required></select>
            <label>Sector</label>
            <input type="text" maxlength="100">
            <p>Quién organiza?</p>
            <label>Nombre</label>
            <input type="text" maxlength="200" required>
            <label>Email</label>
            <input type="email" required>
            <label>Numero de Celular</label>
            <input type="tel">
            <div id="contacto-div">
                <label>Contacto</label>
                <select id="contacto-select" onchange="contacto()">
                    <option disabled selected value></option>
                    <option>Whatsapp</option>
                    <option>Telegram</option>
                    <option>X</option>
                    <option>Instagram</option>
                    <option>Tiktok</option>
                    <option>Otra</option>
                </select>
            </div>
            <p>Dónde?</p>
            <label>Hora de inicio</label>
            <input type="datetime-local" required>
            <label>Hora de termino</label>
            <input type="datetime-local">
            <label>Descripción</label>
            <input  type="text" style="height: 100px; width: 250px;">
            <label>Tema</label>
            <select id="temas-select" onchange="otroTema()" required>
                <option>Música</option>
                <option>Deporte</option>
                <option>Ciencias</option>
                <option>Religión</option>
                <option>Política</option>
                <option>Tecnología</option>
                <option>Juegos</option>
                <option>Baile</option>
                <option>Comida</option>
                <option>Otro</option>
            </select>
            <input id="tema-otro-input" type="text" style="display: none;">
            <label>Foto</label>
            <div id="imagenes-div">
                <input type="file" onchange="otraImagen()" required>
            </div>
        </form>
        <button onclick="window.confirm('¿Está seguro que desea agregar esta actividad?')">Agregar esta actividad</button>
    </div>
    <script src="./js/select.js"></script>
    <script src="/js/sidenav.js"></script>
</body>
</html>
